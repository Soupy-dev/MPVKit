name: Metal Sample Buffer

on:
  push:
    branches:
      - eclipse-mpv-metal
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_build:
        description: "Build iOS, tvOS, and arm64 macOS xcframework artifacts"
        required: false
        default: "false"
      luna_repository:
        description: "Optional owner/repo for a Luna compile smoke test"
        required: false
        default: ""
      luna_ref:
        description: "Optional Luna branch, tag, or SHA"
        required: false
        default: "main"

jobs:
  package-and-demo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Static acceptance checks
        run: |
          set -euo pipefail
          test -d Sources/MPVKitSampleBuffer
          test -d Sources/MPVKitSampleBufferGPL
          ! grep -R -n -E 'OpenGL|GLK|EAGL|CVOpenGLESTexture' Sources/MPVKitSampleBuffer Sources/MPVKitSampleBufferGPL
          grep -R -n 'MPVMetalSampleBufferRenderer' Sources/MPVKitSampleBuffer Sources/MPVKitSampleBufferGPL
          grep -R -n '#if os(iOS)' Sources/MPVKitSampleBuffer Sources/MPVKitSampleBufferGPL
          grep -R -n 'unsupportedPlatform' Sources/MPVKitSampleBuffer Sources/MPVKitSampleBufferGPL
          test -d Demo/Demo-iOS/Demo-iOS/Player/OpenGL
          grep -R -n 'ios-sample-buffer' Sources/BuildScripts/patch/libmpv Sources/BuildScripts/XCFrameworkBuild/main.swift

      - name: Verify native patch chain
        run: |
          bash Scripts/check-native-patches.sh
          bash Scripts/check-apple-pip-native.sh

      - name: Verify wrapper parity
        run: bash Scripts/check-sample-buffer-parity.sh

      - name: Validate package manifests and core state tests
        run: |
          set -euo pipefail
          swift package dump-package >/dev/null
          swift test --filter MPVKitSampleBufferCoreTests
          swift build --triple arm64-apple-macosx11.0 --target MPVKitSampleBufferGPL

      - name: Validate local binary-artifact routing
        run: bash Scripts/check-package-artifact-routing.sh

      - name: Resolve demo packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo/Demo-iOS/Demo-iOS.xcodeproj \
            -scheme Demo-iOS

      - name: Build Demo-iOS for simulator
        run: |
          xcodebuild \
            -project Demo/Demo-iOS/Demo-iOS.xcodeproj \
            -scheme Demo-iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Demo-tvOS for simulator
        run: |
          xcodebuild \
            -project Demo/Demo-tvOS/Demo-tvOS.xcodeproj \
            -scheme Demo-tvOS \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Demo-macOS for Apple Silicon
        run: |
          xcodebuild \
            -project Demo/Demo-macOS/Demo-macOS.xcodeproj \
            -scheme Demo-macOS \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  native-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_build == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [gpl, lgpl]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install autoconf automake cmake libtool nasm ninja pkg-config
          python -m pip install meson==1.4.2

      - name: Build ${{ matrix.flavor }} Apple-platform artifacts
        run: |
          build_args=()
          if [[ "${{ matrix.flavor }}" == "gpl" ]]; then
            build_args+=(enable-gpl)
          fi
          make build "${build_args[@]}" platform=ios,tvos,macos
          bash Scripts/check-built-apple-symbols.sh
          mkdir -p "artifacts/${{ matrix.flavor }}"
          cd dist/release
          if [[ "${{ matrix.flavor }}" == "gpl" ]]; then
            for name in Libmpv Libavcodec Libavdevice Libavformat Libavfilter Libavutil Libswresample Libswscale; do
              mv "${name}.xcframework.zip" "${name}-GPL.xcframework.zip"
              mv "${name}.xcframework.checksum.txt" "${name}-GPL.xcframework.checksum.txt"
            done
            for name in libmpv FFmpeg; do
              if [ -f "${name}-all.zip" ]; then
                mv "${name}-all.zip" "${name}-GPL-all.zip"
              fi
            done
          fi
          cd ../..
          cp dist/release/*.zip "artifacts/${{ matrix.flavor }}/"
          shasum -a 256 "artifacts/${{ matrix.flavor }}"/*.zip \
            > "artifacts/${{ matrix.flavor }}/checksums.sha256"

      - name: Validate ${{ matrix.flavor }} wrappers and demos against fresh artifacts
        env:
          MPVKIT_LOCAL_ARTIFACTS_DIR: ${{ github.workspace }}/dist/release
        run: |
          set -euo pipefail

          if [[ "${{ matrix.flavor }}" == "gpl" ]]; then
            cp docs/Package.gpl.template.swift Package.swift
            wrapper_target=MPVKitSampleBufferGPL
          else
            cp docs/Package.template.swift Package.swift
            wrapper_target=MPVKitSampleBuffer
            for project in \
              Demo/Demo-iOS/Demo-iOS.xcodeproj/project.pbxproj \
              Demo/Demo-tvOS/Demo-tvOS.xcodeproj/project.pbxproj \
              Demo/Demo-macOS/Demo-macOS.xcodeproj/project.pbxproj; do
              sed -i '' 's/productName = "MPVKit-GPL";/productName = MPVKit;/' "$project"
            done
            for source in \
              Demo/Demo-iOS/Demo-iOS/ContentView.swift \
              Demo/Demo-tvOS/Demo-tvOS/ContentView.swift \
              Demo/Demo-macOS/Demo-macOS/ContentView.swift; do
              sed -i '' 's/import MPVKitSampleBufferGPL/import MPVKitSampleBuffer/' "$source"
            done
          fi

          swift package dump-package \
            | grep -E 'dist/release/(xcframework/)?Libmpv(-GPL)?\.xcframework(\.zip)?'
          swift build --triple arm64-apple-macosx11.0 --target "$wrapper_target"

          build_demo() {
            local project="$1"
            local scheme="$2"
            local sdk="$3"
            local destination="$4"
            local derived_data="$5"
            xcodebuild \
              -project "$project" \
              -scheme "$scheme" \
              -configuration Debug \
              -sdk "$sdk" \
              -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/$derived_data" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          }

          build_demo Demo/Demo-iOS/Demo-iOS.xcodeproj Demo-iOS \
            iphonesimulator 'generic/platform=iOS Simulator' "demo-ios-simulator-${{ matrix.flavor }}"
          build_demo Demo/Demo-iOS/Demo-iOS.xcodeproj Demo-iOS \
            iphoneos 'generic/platform=iOS' "demo-ios-device-${{ matrix.flavor }}"
          build_demo Demo/Demo-tvOS/Demo-tvOS.xcodeproj Demo-tvOS \
            appletvsimulator 'generic/platform=tvOS Simulator' "demo-tvos-simulator-${{ matrix.flavor }}"
          build_demo Demo/Demo-tvOS/Demo-tvOS.xcodeproj Demo-tvOS \
            appletvos 'generic/platform=tvOS' "demo-tvos-device-${{ matrix.flavor }}"
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build_demo \
            Demo/Demo-macOS/Demo-macOS.xcodeproj Demo-macOS \
            macosx 'generic/platform=macOS' "demo-macos-arm64-${{ matrix.flavor }}"

      - name: Exercise the native gpu-next PiP runtime
        if: runner.arch == 'ARM64'
        env:
          MPVKIT_LOCAL_ARTIFACTS_DIR: ${{ github.workspace }}/dist/release
          MPVKIT_NATIVE_RUNTIME_REQUIRED: "1"
        run: bash Scripts/check-apple-pip-runtime.sh

      - name: Report unavailable native runtime gate
        if: runner.arch != 'ARM64'
        run: |
          echo "::notice::Native gpu-next PiP runtime validation requires an Apple Silicon runner; artifact, ABI, wrapper, and demo checks still ran."

      - name: Upload sample-buffer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpvkit-apple-sample-buffer-artifacts-${{ matrix.flavor }}
          path: |
            artifacts/**
          if-no-files-found: error

  luna-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.luna_repository != ''
    runs-on: macos-15
    steps:
      - name: Checkout MPVKit fork
        uses: actions/checkout@v4
        with:
          path: MPVKit

      - name: Checkout Luna
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.luna_repository }}
          ref: ${{ inputs.luna_ref }}
          path: Luna

      - name: Point Luna at this MPVKit checkout
        run: |
          set -euo pipefail
          cd Luna
          ruby <<'RUBY'
          path = "Luna.xcodeproj/project.pbxproj"
          text = File.read(path)
          text = text.gsub(%r{(\s*[A-F0-9]+ /\* XCRemoteSwiftPackageReference "MPVKit" \*/ = \{\n)\s*isa = XCRemoteSwiftPackageReference;\n\s*repositoryURL = "[^"]*/MPVKit";\n\s*requirement = \{\n\s*(?:branch = [^;]+;\n\s*)?(?:kind = [^;]+;\n\s*)?(?:minimumVersion = [^;]+;\n\s*)?\};\n\s*\};}) do
            "#{$1}\t\t\tisa = XCLocalSwiftPackageReference;\n\t\t\trelativePath = ../MPVKit;\n\t\t};"
          end
          File.write(path, text)
          RUBY
          if [ -f Build.local.xcconfig.example ] && [ ! -f Build.local.xcconfig ]; then
            cp Build.local.xcconfig.example Build.local.xcconfig
          fi
          cat >> Build.local.xcconfig <<'EOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) LUNA_MPVKIT_FORK_EXPOSES_METAL_SAMPLE_BUFFER_PIP LUNA_MPVKIT_METAL_SAMPLE_BUFFER_PIP_IMPLEMENTED
          EOF

      - name: Build Luna for simulator
        run: |
          xcodebuild \
            -project Luna/Luna.xcodeproj \
            -scheme Luna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
